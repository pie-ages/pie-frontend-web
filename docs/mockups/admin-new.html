<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novo administrador — pie-frontend-web</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f3f4f6; color: #000; }
  .mockup-header { position: fixed; top: 0; left: 0; right: 0; background: #1f2937; color: #fff; padding: 8px 16px; font-size: 12px; z-index: 100; }
  .page { padding: 24px; max-width: 1200px; margin: 0 auto; }
  .breadcrumb { display: inline-flex; align-items: center; gap: 8px; color: #6b7280; text-decoration: none; font-size: 14px; margin-bottom: 24px; }
  .header { margin-bottom: 24px; }
  .title { font-size: 28px; font-weight: 600; margin-bottom: 8px; }
  .subtitle { font-size: 14px; color: #6b7280; line-height: 1.6; }
  .warning { background: #fef3c7; border: 1px solid #fde68a; border-radius: 8px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .warning-icon { width: 18px; height: 18px; stroke: #92400e; fill: none; stroke-width: 2; }
  .warning-text { font-size: 14px; color: #92400e; }
  .form { background: #fff; border: 1px solid rgba(32,30,29,0.4); border-radius: 12px; padding: 24px; max-width: 600px; }
  .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .form-group label { font-size: 14px; font-weight: 500; color: #201e1d; }
  .form-group input { padding: 10px 12px; border: 1px solid rgba(32,30,29,0.4); border-radius: 8px; font-size: 14px; background: #f8f4f4; }
  .form-group input:focus { outline: none; border-color: #661414; }
  .form-group input.error { border-color: #ff383c; }
  .error-message { font-size: 12px; color: #ff383c; }
  .actions { display: flex; justify-content: flex-end; gap: 12px; padding-top: 16px; border-top: 1px solid rgba(32,30,29,0.1); }
  .cancel-link { padding: 10px 20px; background: transparent; color: #6b7280; border: none; font-size: 14px; cursor: pointer; text-decoration: none; }
  .btn-primary { padding: 10px 20px; background: #661414; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; }
</style>
</head>
<body>
<div class="mockup-header">Mockup: /admin/new — estado: formulário pronto</div>
<div class="page">
  <a href="#" class="breadcrumb">← Voltar para empresas</a>
  <div class="header">
    <h1 class="title">Novo administrador</h1>
    <p class="subtitle">Cadastre uma pessoa para ajudar a gerenciar a plataforma Piê.</p>
  </div>

  <div class="warning">
    <svg class="warning-icon" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <p class="warning-text">Esta conta será criada com <strong>perfil de administrador</strong>.</p>
  </div>

  <form class="form">
    <div class="form-group">
      <label for="name">Nome</label>
      <input type="text" id="name" placeholder="Ex: Marina Bezerra" value="Marina Bezerra">
    </div>
    <div class="form-group">
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="nome@pie.com.br" value="marina@pie.com.br">
    </div>
    <div class="form-group">
      <label for="password">Senha</label>
      <input type="password" id="password" placeholder="Mínimo de 8 caracteres" value="senha1234">
    </div>
    <div class="form-group">
      <label for="confirmPassword">Confirmar senha</label>
      <input type="password" id="confirmPassword" placeholder="••••••••" value="senha1234">
    </div>
    <div class="actions">
      <a href="#" class="cancel-link">Cancelar</a>
      <button type="submit" class="btn-primary">Criar administrador</button>
    </div>
  </form>
</div>
</body>
</html>
