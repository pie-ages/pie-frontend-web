<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro em análise — pie-frontend-web</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f3f4f6; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .container { display: flex; width: 100%; max-width: 1200px; min-height: 100vh; }
  .mockup-header { position: fixed; top: 0; left: 0; right: 0; background: #1f2937; color: #fff; padding: 8px 16px; font-size: 12px; z-index: 100; }
  .content { padding: 60px 48px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .icon { font-size: 80px; color: #661414; margin-bottom: 24px; }
  .title { font-size: 32px; color: #000; margin-bottom: 16px; }
  .description { font-size: 16px; color: #6b7280; line-height: 1.6; margin-bottom: 32px; max-width: 500px; }
  .button { padding: 14px 24px; background: #661414; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 500; cursor: pointer; margin-top: 16px; }
</style>
</head>
<body>
<div class="mockup-header">Mockup: /pending — estado: tela única</div>
<div class="content">
  <div class="icon">⏳</div>
  <h1>Cadastro em análise</h1>
  <p>Sua loja foi cadastrada e está aguardando aprovação da equipe do Piê. Você receberá um e-mail assim que for aprovada, geralmente em até 2 dias úteis.</p>
  <button class="button">Voltar para o login</button>
</div>
</body>
</html>
